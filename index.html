<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Grossiste - Bon de Commande</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        input[type="number"] { width: 60px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        .total-section { text-align: right; font-size: 1.3em; font-weight: bold; margin-top: 20px; padding-top: 20px; border-top: 2px solid #2c3e50; }
        button { display: block; width: 100%; background: #27ae60; color: white; border: none; padding: 15px; font-size: 1.1em; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #219653; }
    </style>
</head>
<body>

<div class="container">
    <h1>Espace Grossiste : Passer Commande</h1>
    
    <table>
        <thead>
            <tr>
                <th>Produit</th>
                <th>Prix Unitaire</th>
                <th>Quantité</th>
                <th>Sous-total</th>
            </tr>
        </thead>
        <tbody id="product-list">
            <!-- Les produits seront injectés ici par JavaScript -->
        </tbody>
    </table>

    <div class="total-section">
        Total Commande : <span id="grand-total">0.00</span> €
    </div>

    <button onclick="validerCommande()">Valider et Envoyer la Commande</button>
</div>

<script>
// Base de données des produits
const produits = [
    { id: 1, nom: "Chocolat", prix: 2.00 },
    { id: 2, nom: "Farine", prix: 5.00 },
    { id: 3, nom: "Levure", prix: 4.00 },
    { id: 4, nom: "Lait", prix: 4.00 },
    { id: 5, nom: "Sucre", prix: 7.50 },
    { id: 6, nom: "Sel", prix: 7.50 },
    { id: 7, nom: "Oeuf", prix: 2.00 },
    { id: 8, nom: "Tomate", prix: 3.00 },
    { id: 9, nom: "Salade", prix: 3.00 },
    { id: 10, nom: "Pain Burger", prix: 4.00 },
    { id: 11, nom: "Moutarde", prix: 5.00 }
];

const tbody = document.getElementById('product-list');

// Génération de la liste des produits
produits.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><strong>${p.nom}</strong></td>
        <td>${p.prix.toFixed(2)} €</td>
        <td><input type="number" min="0" value="0" data-id="${p.id}" onchange="calculerTotal()"></td>
        <td><span id="subtotal-${p.id}">0.00</span> €</td>
    `;
    tbody.appendChild(tr);
});

// Calcul des totaux en temps réel
function calculerTotal() {
    let grandTotal = 0;
    produits.forEach(p => {
        const input = document.querySelector(`input[data-id="${p.id}"]`);
        const qte = parseInt(input.value) || 0;
        const subtotal = qte * p.prix;
        
        document.getElementById(`subtotal-${p.id}`).innerText = subtotal.toFixed(2);
        grandTotal += subtotal;
    });
    document.getElementById('grand-total').innerText = grandTotal.toFixed(2);
}

// Action lors de la validation
function validerCommande() {
    let recap = "Votre commande :\n";
    let dynamicOrder = [];
    
    produits.forEach(p => {
        const qte = parseInt(document.querySelector(`input[data-id="${p.id}"]`).value) || 0;
        if(qte > 0) {
            recap += `- ${p.nom} x${qte} (${(qte*p.prix).toFixed(2)}€)\n`;
            dynamicOrder.push({ produit: p.nom, quantite: qte });
        }
    });
    
    if(dynamicOrder.length === 0) {
        alert("Veuillez sélectionner au moins un produit.");
        return;
    }
    
    recap += `\nTotal : ${document.getElementById('grand-total').innerText}€`;
    alert(recap + "\n\nCommande enregistrée ! (Ici, vous pouvez lier cela à un système d'envoi de mail ou de logs)");
}
</script>

</body>
</html>
