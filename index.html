<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDF – Énergie & Innovation</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --edf-blue: #005BBB;
            --edf-orange: #FF7900;
            --edf-dark: #0a192f;
            --light: #f8fafc;
            --white: #ffffff;
        }

        * { margin:0; padding:0; box-sizing:border-box; scroll-behavior: smooth; }
        body { font-family: 'Open Sans', sans-serif; background: var(--light); color: var(--edf-dark); }

        /* NAVIGATION */
        nav { 
            background: var(--white); 
            height: 80px; display: flex; align-items: center; 
            box-shadow: 0 2px 20px rgba(0,0,0,0.05); 
            position: sticky; top: 0; z-index: 1000; 
        }
        .nav-inner { max-width: 1200px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; }
        .logo { font-family: 'Montserrat'; font-weight: 900; font-size: 2.2rem; color: var(--edf-blue); text-decoration: none; }
        .logo span { color: var(--edf-orange); }
        .nav-links button { 
            background: none; border: none; font-family: 'Montserrat'; font-weight: 700; font-size: 0.8rem; 
            cursor: pointer; padding: 0.8rem 1.2rem; border-radius: 50px; transition: 0.3s;
        }
        .nav-links button.active { background: var(--edf-blue); color: white; }

        /* HERO */
        .hero { 
            background: linear-gradient(135deg, var(--edf-blue) 0%, #003a7a 100%);
            color: white; border-radius: 0 0 50px 50px; padding: 5rem 2rem; 
            text-align: center; margin-bottom: 3rem;
        }

        /* BOUTIQUE */
        .shop-container { max-width: 1300px; margin: 0 auto; padding: 2rem; }
        .shop-layout { display: grid; grid-template-columns: 1fr 350px; gap: 3rem; }
        .category-title { grid-column: 1 / -1; margin: 2rem 0 1rem; font-family: 'Montserrat'; font-size: 1.6rem; border-bottom: 3px solid var(--edf-orange); padding-bottom: 5px; color: var(--edf-blue); }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        
        /* CARTES SANS PHOTOS - CONTENU CENTRÉ */
        .product-card { 
            background: white; 
            border-radius: 20px; 
            padding: 3rem 1.5rem; /* Augmentation du padding pour compenser l'absence d'image */
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s; 
            display: flex; 
            flex-direction: column; 
            align-items: center; /* Centre horizontalement */
            justify-content: center; /* Centre verticalement */
            border: 1px solid #eee; 
            text-align: center;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); }
        
        .product-card h4 { 
            font-family: 'Montserrat'; 
            margin-bottom: 1rem; 
            font-size: 1.3rem; 
            color: var(--edf-dark);
            line-height: 1.2;
        }
        
        .price-tag { 
            color: var(--edf-orange); 
            font-weight: 900; 
            font-size: 1.6rem; 
            margin-bottom: 1.5rem; 
        }
        
        /* PANIER */
        .cart-panel { 
            background: var(--white); padding: 2rem; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
            border: 1px solid #eee; position: sticky; top: 110px; height: fit-content;
        }

        .btn-main { 
            background: var(--edf-blue); color: white; border: none; padding: 1rem; border-radius: 12px; 
            cursor: pointer; font-weight: 700; font-family: 'Montserrat'; transition: 0.3s; width: 100%;
        }
        .btn-main:hover { background: var(--edf-orange); }

        .page { display: none; }
        .page.active { display: block; }

        @media (max-width: 1000px) { .shop-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<nav>
    <div class="nav-inner">
        <a href="#" class="logo" onclick="showPage('accueil')">EDF<span>.</span></a>
        <div class="nav-links">
            <button onclick="showPage('accueil')" id="btn-accueil" class="active">ACCUEIL</button>
            <button onclick="showPage('boutique')" id="btn-boutique">BOUTIQUE</button>
            <button onclick="showPage('avis')" id="btn-avis">AVIS</button>
            <button onclick="checkStaffAccess()" id="btn-staff">STAFF</button>
        </div>
    </div>
</nav>

<div id="accueil" class="page active">
    <div class="hero">
        <h1 style="font-family:'Montserrat'; font-size:3rem; margin-bottom:1rem;">Innovation Électrique</h1>
        <p>Le futur de votre confort commence ici.</p>
        <button onclick="showPage('boutique')" class="btn-main" style="width:auto; padding: 1rem 2.5rem; border-radius: 50px; margin-top: 1.5rem;">Ouvrir la boutique</button>
    </div>
</div>

<div id="boutique" class="page">
    <div class="shop-container">
        <div class="shop-layout">
            <div id="product-list">
                </div>
            
            <div class="cart-panel">
                <h3 style="font-family: 'Montserrat'; margin-bottom: 1.5rem;">🛒 Mon Panier</h3>
                <input type="text" id="client-name" placeholder="Nom RP complet" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin-bottom:1rem;">
                <div id="cart-items" style="margin-bottom: 1.5rem; min-height: 50px;">
                    <p style="color: #999; text-align: center;">Vide.</p>
                </div>
                <div style="border-top: 2px dashed #eee; padding-top: 1rem; display: flex; justify-content: space-between; font-weight: 900; font-size: 1.4rem;">
                    <span>TOTAL</span>
                    <span id="total-price" style="color:var(--edf-blue)">0 €</span>
                </div>
                <button class="btn-main" style="margin-top: 1.5rem; background: var(--edf-orange);" onclick="processOrder()">COMMANDER</button>
            </div>
        </div>
    </div>
</div>

<div id="avis" class="page">
    <div class="shop-container" style="max-width: 600px; text-align: center;">
        <h2 style="margin-bottom:2rem;">Votre avis nous intéresse</h2>
        <div class="product-card">
            <textarea id="review-text" style="width: 100%; height: 100px; padding: 1rem; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 1rem;" placeholder="Message..."></textarea>
            <button class="btn-main" onclick="alert('Merci !')">Envoyer</button>
        </div>
    </div>
</div>

<div id="staff-login" class="page">
    <div class="shop-container" style="max-width: 400px; text-align: center;">
        <div class="product-card">
            <h2>Accès Staff</h2>
            <input type="password" id="staff-code" placeholder="Code" style="width:100%; padding:12px; border:1px solid #ddd; margin: 1rem 0; text-align:center;">
            <button class="btn-main" onclick="verifyCode()">Connexion</button>
        </div>
    </div>
</div>

<div id="staff-dashboard" class="page">
    <div class="shop-container">
        <div style="display:flex; justify-content:space-between; margin-bottom:2rem;">
            <h2>Commandes</h2>
            <button onclick="clearAllOrders()" style="background:#ff4757; color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer;">Vider</button>
        </div>
        <div id="orders-list"></div>
    </div>
</div>

<script>
    const categories = [
        {
            title: "Équipements Électriques et Sécurité",
            items: [
                { name: "Armoire électrique", price: 1699 },
                { name: "Caméra de sécurité", price: 799 },
                { name: "Caméra 360°", price: 699 },
                { name: "Tableau électrique", price: 549 },
                { name: "Boitier électrique", price: 299 }
            ]
        },
        {
            title: "Éclairage",
            items: [
                { name: "Lustre Royal", price: 26000 },
                { name: "Petit lustre", price: 9000 },
                { name: "Lampadaire", price: 699 },
                { name: "Projecteur", price: 499 },
                { name: "Néon large", price: 499 },
                { name: "Lampe design bleue", price: 359 },
                { name: "Néons standards", price: 299.99 },
                { name: "Lumière sol", price: 299 },
                { name: "Néon vertical", price: 299 }
            ]
        },
        {
            title: "Énergie Solaire",
            items: [
                { name: "Panneau solaire (support)", price: 1200 },
                { name: "Panneau solaire (plat)", price: 1000 },
                { name: "Lampadaire solaire", price: 700 }
            ]
        }
    ];

    function initShop() {
        const container = document.getElementById('product-list');
        container.innerHTML = categories.map(cat => `
            <h2 class="category-title">${cat.title}</h2>
            <div class="products-grid">
                ${cat.items.map(p => `
                    <div class="product-card">
                        <h4>${p.name}</h4>
                        <span class="price-tag">${p.price.toLocaleString()} €</span>
                        <button class="btn-main" onclick="addToCart('${p.name.replace(/'/g, "\\'")}', ${p.price})">Ajouter au panier</button>
                    </div>
                `).join('')}
            </div>
        `).join('');
    }

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        const btn = document.getElementById('btn-' + pageId);
        if(btn) btn.classList.add('active');
    }

    let cart = []; let total = 0;
    function addToCart(name, price) {
        cart.push({name, price}); total += price; updateCart();
    }

    function updateCart() {
        const cartDiv = document.getElementById('cart-items');
        if(cart.length === 0) cartDiv.innerHTML = '<p style="color:#999; text-align:center;">Vide.</p>';
        else cartDiv.innerHTML = cart.map(i => `<div style="display:flex; justify-content:space-between; margin-bottom:5px; background:#f9f9f9; padding:8px; border-radius:8px; font-size:0.9rem;"><span>${i.name}</span><b>${i.price.toLocaleString()} €</b></div>`).join('');
        document.getElementById('total-price').innerText = total.toLocaleString('fr-FR') + " €";
    }

    function processOrder() {
        const name = document.getElementById('client-name').value;
        if(!name || cart.length === 0) return alert("Vérifiez le nom et le panier !");
        const order = { client: name, items: [...cart], total: total, date: new Date().toLocaleString('fr-FR') };
        let orders = JSON.parse(localStorage.getItem('edf_orders')) || [];
        orders.push(order);
        localStorage.setItem('edf_orders', JSON.stringify(orders));
        alert("Commande envoyée !");
        cart = []; total = 0; document.getElementById('client-name').value = ""; updateCart();
    }

    function checkStaffAccess() { showPage('staff-login'); }
    function verifyCode() {
        if(document.getElementById('staff-code').value === "1981") { showPage('staff-dashboard'); loadOrders(); } 
        else alert("Refusé.");
    }

    function loadOrders() {
        const listDiv = document.getElementById('orders-list');
        const orders = JSON.parse(localStorage.getItem('edf_orders')) || [];
        listDiv.innerHTML = orders.reverse().map(o => `
            <div class="product-card" style="text-align:left; margin-bottom:1rem; padding:1.5rem; align-items:flex-start;">
                <strong>${o.client}</strong> <small>${o.date}</small>
                <p style="margin:10px 0;">${o.items.map(i => i.name).join(', ')}</p>
                <b style="color:var(--edf-orange);">${o.total.toLocaleString()} €</b>
            </div>
        `).join('');
    }

    function clearAllOrders() { if(confirm("Vider ?")) { localStorage.removeItem('edf_orders'); loadOrders(); } }

    window.onload = initShop;
</script>

</body>
</html>
