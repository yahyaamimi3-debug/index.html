<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROSSISTE . PRO</title>
    <style>
        /* --- DESIGN CYBERPUNK INDUSTRIEL --- */
        :root {
            --bg-main: #070a13;
            --bg-surface: #0f1524;
            --bg-surface-light: #1d2842;
            --border-glow: #38bdf8;
            --border-mute: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --radius: 12px;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding-bottom: 80px;
        }
        
        /* --- NAVIGATION --- */
        nav { 
            background-color: rgba(15, 21, 36, 0.85); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-mute);
            padding: 15px 0; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-weight: 800; letter-spacing: 1.5px; color: var(--border-glow); font-size: 1.2em; }
        .nav-links { display: flex; gap: 10px; }
        nav button { 
            background: transparent; border: 1px solid transparent; color: var(--text-muted); 
            padding: 8px 16px; font-size: 0.9em; font-weight: 600; cursor: pointer; border-radius: var(--radius);
        }
        nav button:hover { color: var(--text-main); background-color: var(--bg-surface-light); }
        nav button.active { color: var(--bg-main); background-color: var(--border-glow); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        
        header { 
            background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-main) 100%);
            padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border-mute);
        }
        header h1 { margin: 0; font-size: 2em; font-weight: 800; }
        header p { margin: 8px 0 0; font-size: 0.9em; color: var(--border-glow); letter-spacing: 1px; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .page { display: none; }
        .page.active-page { display: block; }
        
        h2 { font-size: 1.5em; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        h2::before { content: ''; display: inline-block; width: 4px; height: 24px; background: var(--border-glow); border-radius: 2px; }
        .subtitle { color: var(--text-muted); margin-bottom: 25px; margin-top: -15px; font-size: 0.9em; }

        /* --- FORMULAIRE NOM RP --- */
        .rp-box {
            background: var(--bg-surface); padding: 20px; border-radius: var(--radius);
            border: 1px solid var(--border-mute); margin-bottom: 30px; display: flex; flex-direction: column; gap: 10px;
        }
        .rp-box label { font-size: 0.9em; font-weight: 600; color: var(--border-glow); text-transform: uppercase; }
        .rp-box input {
            background: var(--bg-main); border: 1px solid var(--border-mute); color: #fff;
            padding: 12px; font-size: 1em; border-radius: 8px; outline: none;
        }
        .rp-box input:focus { border-color: var(--border-glow); }
        
        /* --- GRID CATALOGUE STYLE --- */
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { 
            background: var(--bg-surface); border: 1px solid var(--border-mute); 
            border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
        }
        .product-card:hover { border-color: var(--border-glow); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56,189,248,0.1); }
        .product-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .product-title { font-weight: 700; font-size: 1.05em; margin: 0 0 8px 0; }
        .product-price { color: var(--accent-green); font-weight: 700; font-size: 1.1em; margin-bottom: 15px; }
        
        /* --- ACTION BUTTONS --- */
        .btn { 
            background: var(--bg-surface-light); color: var(--text-main); border: 1px solid var(--border-mute); 
            padding: 10px 15px; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.85em;
        }
        .btn:hover { background: var(--border-glow); color: var(--bg-main); }
        .btn-add { width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; }

        /* --- BOUTON FLOTTANT PANIER --- */
        .cart-toggle {
            position: fixed; bottom: 25px; right: 25px; background: var(--border-glow);
            color: var(--bg-main); border: none; padding: 15px 25px; font-weight: 700;
            border-radius: 30px; cursor: pointer; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
            display: flex; align-items: center; gap: 10px; z-index: 99;
        }
        .cart-toggle:hover { transform: scale(1.05); }
        .cart-count { background: var(--bg-main); color: var(--border-glow); padding: 2px 8px; border-radius: 10px; font-size: 0.8em; }

        /* --- POPUP PANIER MODAL --- */
        .cart-modal {
            position: fixed; top: 0; right: -400px; width: 400px; height: 100%;
            background: var(--bg-surface); border-left: 1px solid var(--border-mute);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5); z-index: 1000; padding: 25px;
            display: flex; flex-direction: column; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cart-modal.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-mute); padding-bottom: 15px; }
        .cart-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.5em; cursor: pointer; }
        .cart-close:hover { color: var(--accent-red); }
        .cart-items { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-right: 5px; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; border: 1px solid var(--border-mute); }
        .item-details h4 { margin: 0; font-size: 0.95em; }
        .item-details span { color: var(--accent-green); font-size: 0.85em; font-weight: 600; }
        .item-controls { display: flex; align-items: center; gap: 8px; }
        .item-controls input { background: var(--bg-main); border: 1px solid var(--border-mute); color: #fff; width: 45px; text-align: center; padding: 5px; border-radius: 4px; }
        .btn-del { background: transparent; border: none; color: var(--accent-red); cursor: pointer; font-weight: bold; }

        .cart-footer { margin-top: 20px; border-top: 1px solid var(--border-mute); padding-top: 15px; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.2em; font-weight: 700; margin-bottom: 15px; }
        .cart-total span { color: var(--accent-green); }
        .btn-order { width: 100%; background: var(--accent-green); color: var(--bg-main); font-size: 1em; padding: 12px; }
        .btn-order:hover { background: #059669; color: #fff; }

        /* --- DASHBOARD EMPLOYE --- */
        #lock-screen { text-align: center; padding: 40px 20px; max-width: 360px; margin: 40px auto; border: 1px solid var(--border-mute); border-radius: var(--radius); background: var(--bg-surface); }
        input[type="password"] { background: var(--bg-main); border: 1px solid var(--border-mute); color: #fff; padding: 12px; width: 100%; margin-bottom: 20px; text-align: center; border-radius: 6px; outline: none; }
        #employee-dashboard { display: none; }
        .orders-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .order-card { background: var(--bg-surface); border: 1px solid var(--border-mute); padding: 20px; border-radius: var(--radius); }
        .order-meta { display: flex; justify-content: space-between; font-size: 0.8em; color: var(--text-muted); border-bottom: 1px solid var(--border-mute); padding-bottom: 10px; margin-bottom: 10px; }
        
        @media (max-width: 450px) { .cart-modal { width: 100%; right: -100%; } }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo">GROSSISTE.PRO</div>
            <div class="nav-links">
                <button id="nav-catalogue" class="active" onclick="changerPage('catalogue')">CATALOGUE</button>
                <button id="nav-employe" onclick="changerPage('employe')">ENTREPÔT</button>
            </div>
        </div>
    </nav>

    <header>
        <h1>CENTRALE DE COMMANDE</h1>
        <p>PLATEFORME EXCLUSIVE POUR PROFESSIONNELS</p>
    </header>

    <div class="container">

        <div id="page-catalogue" class="page active-page">
            
            <div class="rp-box">
                <label for="player-name-rp">Nom complet en Ville (Nom RP) *</label>
                <input type="text" id="player-name-rp" placeholder="Ex: Jean Roux" required>
            </div>

            <h2>PRODUITS DISPONIBLES</h2>
            <div class="subtitle">Sélectionnez vos articles pour remplir votre bon de commande.</div>
            
            <div class="catalog-grid" id="catalog-container">
                </div>
        </div>

        <div id="page-employe" class="page">
            <div id="lock-screen">
                <h2>ACCÈS SÉCURISÉE</h2>
                <input type="password" id="code-secu" placeholder="CODE D'ACCÈS">
                <button class="btn" style="width:100%" onclick="authentifierEmploye()">CONNEXION</button>
            </div>

            <div id="employee-dashboard">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2>HISTORIQUE LOGISTIQUE</h2>
                    <button class="btn" style="background:rgba(239,68,68,0.2); color:var(--accent-red);" onclick="viderToutesLesCommandes()">EFFACER</button>
                </div>
                <div id="orders-feed" class="orders-grid"></div>
            </div>
        </div>

    </div>

    <button class="cart-toggle" onclick="togglePanier(true)">
        🛒 PANIER <span class="cart-count" id="global-cart-count">0</span>
    </button>

    <div class="cart-modal" id="cart-popup">
        <div class="cart-header">
            <h3>Votre Commande</h3>
            <button class="cart-close" onclick="togglePanier(false)">×</button>
        </div>
        <div class="cart-items" id="cart-items-container">
            </div>
        <div class="cart-footer">
            <div class="cart-total">Total : <span id="cart-total-price">0.00</span> €</div>
            <button class="btn btn-order" onclick="transmettreCommande()">VALIDER LA COMMANDE</button>
        </div>
    </div>

<script>
const DISCORD_WEBHOOK_URL = "https://discordapp.com/api/webhooks/1519738501413736578/1YO6Mqm6FKQl66e0CaZoVRwi7E2OBs5gfILGYU6zlnD30dMVZDBVyY-OdQMcAvSU_vKT";

const catalogueProduits = [
    { id: 1, nom: "Chocolat", prix: 2.00 }, { id: 2, nom: "Farine", prix: 5.00 },
    { id: 3, nom: "Levure", prix: 4.00 }, { id: 4, nom: "Lait", prix: 4.00 },
    { id: 5, nom: "Sucre", prix: 7.50 }, { id: 6, nom: "Sel", prix: 7.50 },
    { id: 7, nom: "Oeuf", prix: 2.00 }, { id: 8, nom: "Tomate", prix: 3.00 },
    { id: 9, nom: "Salade", prix: 3.00 }, { id: 10, nom: "Pain Burger", prix: 4.00 },
    { id: 11, nom: "Moutarde", prix: 5.00 }, { id: 12, nom: "Cornichon", prix: 5.00 },
    { id: 13, nom: "Beurre", prix: 4.00 }, { id: 14, nom: "Pomme de terre (25kg)", prix: 20.00 },
    { id: 15, nom: "Huile de friture", prix: 5.00 }, { id: 16, nom: "Chocolat en poudre", prix: 15.00 },
    { id: 17, nom: "Café", prix: 25.00 }, { id: 18, nom: "Lait en poudre", prix: 5.00 },
    { id: 19, nom: "Soda", prix: 6.00 }, { id: 20, nom: "Steak", prix: 7.50 },
    { id: 21, nom: "Poire", prix: 5.00 }, { id: 22, nom: "Pomme", prix: 5.00 },
    { id: 23, nom: "Fromage", prix: 6.00 }, { id: 24, nom: "Eau", prix: 3.00 },
    { id: 25, nom: "Chips", prix: 7.50 }, { id: 26, nom: "COUROIE", prix: 150.00 },
    { id: 27, nom: "BATTERIE", prix: 250.00 }, { id: 28, nom: "BOUGGIE", prix: 200.00 }
];

let panier = {};
let baseCommandes = JSON.parse(localStorage.getItem('grossiste_commandes')) || [];

function changerPage(nomPage) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(`page-${nomPage}`).classList.add('active-page');
    document.getElementById(`nav-${nomPage}`).classList.add('active');
    if(nomPage === 'employe' && document.getElementById('employee-dashboard').style.display === 'block') afficherFluxCommandes();
}

// Génération du Catalogue en Grille Moderne
const grid = document.getElementById('catalog-container');
catalogueProduits.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
        <div class="product-info">
            <div>
                <h3 class="product-title">${p.nom}</h3>
                <div class="product-price">${p.prix.toFixed(2)} €</div>
            </div>
            <button class="btn btn-add" onclick="ajouterAuPanier(${p.id})">📥 Ajouter au panier</button>
        </div>
    `;
    grid.appendChild(card);
});

function togglePanier(ouvrir) {
    document.getElementById('cart-popup').classList.toggle('open', ouvrir);
}

function ajouterAuPanier(id) {
    panier[id] = (panier[id] || 0) + 1;
    majAffichagePanier();
}

function changerQuantite(id, qte) {
    if (qte <= 0) { delete panier[id]; } 
    else { panier[id] = qte; }
    majAffichagePanier();
}

function supprimerDuPanier(id) {
    delete panier[id];
    majAffichagePanier();
}

function majAffichagePanier() {
    const container = document.getElementById('cart-items-container');
    container.innerHTML = "";
    let total = 0;
    let nbArticles = 0;

    Object.keys(panier).forEach(id => {
        const prod = catalogueProduits.find(p => p.id == id);
        const qte = panier[id];
        const sousTotal = prod.prix * qte;
        total += sousTotal;
        nbArticles += qte;

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
            <div class="item-details">
                <h4>${prod.nom}</h4>
                <span>${sousTotal.toFixed(2)} €</span>
            </div>
            <div class="item-controls">
                <input type="number" min="1" value="${qte}" onchange="changerQuantite(${id}, parseInt(this.value)||1)">
                <button class="btn-del" onclick="supprimerDuPanier(${id})">✕</button>
            </div>
        `;
        container.appendChild(div);
    });

    document.getElementById('global-cart-count').innerText = nbArticles;
    document.getElementById('cart-total-price').innerText = total.toFixed(2);
}

function transmettreCommande() {
    const nomRP = document.getElementById('player-name-rp').value.trim();
    if(!nomRP) {
        alert("❌ ERREUR : Vous devez indiquer votre NOM RP avant de commander.");
        return;
    }

    const keys = Object.keys(panier);
    if(keys.length === 0) {
        alert("❌ Votre panier est vide.");
        return;
    }

    let prixTotal = document.getElementById('cart-total-price').innerText;
    let texteDiscord = "";
    let listeLog = [];

    keys.forEach(id => {
        const prod = catalogueProduits.find(p => p.id == id);
        const qte = panier[id];
        texteDiscord += `📦 **${prod.nom}** × ${qte}  *( ${(prod.prix * qte).toFixed(2)} € )*\n`;
        listeLog.push({ nom: prod.nom, quantite: qte, prixLigne: (prod.prix * qte).toFixed(2) });
    });

    const ticketID = 'CMD-' + Math.floor(1000 + Math.random() * 9000);
    const heure = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});

    // Enregistrement historique local
    baseCommandes.push({ idTicket: ticketID, heure: heure, nomRP: nomRP, marchandises: listeLog, totalFacture: prixTotal });
    localStorage.setItem('grossiste_commandes', JSON.stringify(baseCommandes));

    // Payload Embed Discord
    const payload = {
        username: "Centrale de Logistique",
        embeds: [{
            title: `📥 Nouvelle Commande Réceptionnée — ${ticketID}`,
            color: 2334458,
            fields: [
                { name: "👤 Client (Nom RP)", value: `**${nomRP}**`, inline: true },
                { name: "🕒 Heure d'Arrivée", value: heure, inline: true },
                { name: "🛒 Marchandises à préparer", value: texteDiscord, inline: false },
                { name: "💰 Total Facturé", value: `**${prixTotal} €**`, inline: false }
            ],
            footer: { text: "Grossiste automatisé Pro v2" },
            timestamp: new Date().toISOString()
        }]
    };

    fetch(DISCORD_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    alert(`✅ Commande enregistrée ! Envoyée sur Discord.`);
    panier = {};
    majAffichagePanier();
    togglePanier(false);
}

function authentifierEmploye() {
    if (document.getElementById('code-secu').value === "2009") {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('employee-dashboard').style.display = 'block';
        afficherFluxCommandes();
    } else {
        alert("ACCÈS REFUSÉ.");
    }
}

function afficherFluxCommandes() {
    const feed = document.getElementById('orders-feed');
    feed.innerHTML = baseCommandes.length === 0 ? "<p style='text-align:center; font-style:italic;'>Aucune préparation en cours.</p>" : "";

    [...baseCommandes].reverse().forEach(cmd => {
        const div = document.createElement('div');
        div.className = 'order-card';
        let items = cmd.marchandises.map(m => `<li><strong>${m.nom}</strong> x${m.quantite} (${m.prixLigne} €)</li>`).join('');
        div.innerHTML = `
            <div class="order-meta"><span>${cmd.idTicket} | RP : <b>${cmd.nomRP}</b></span><span>${cmd.heure}</span></div>
            <ul style="padding-left:15px; margin:0; font-size:0.9em;">${items}</ul>
            <div style="text-align:right; font-weight:700; margin-top:10px; color:var(--accent-green)">Total : ${cmd.totalFacture} €</div>
        `;
        feed.appendChild(div);
    });
}

function viderToutesLesCommandes() {
    if(confirm("Tout vider ?")) { baseCommandes = []; localStorage.removeItem('grossiste_commandes'); afficherFluxCommandes(); }
}
</script>
</body>
</html>
