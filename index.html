<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDF | Portail Énergie</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0066FF;
            --accent: #FF7900;
            --bg: #020617;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin:0; padding:0; box-sizing:border-box; outline: none; border: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        .glow {
            position: fixed; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.07) 0%, transparent 70%);
            top: -10%; right: -5%; z-index: -1; pointer-events: none;
        }

        nav { 
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 850px; height: 60px;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(25px);
            border: 1px solid var(--border) !important; border-radius: 100px; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 1.2rem;
        }

        .nav-links button { 
            background: transparent; color: var(--text-dim); font-weight: 600; font-size: 0.8rem;
            padding: 8px 18px; border-radius: 100px; cursor: pointer; transition: 0.4s;
        }
        .nav-links button.active { background: var(--primary); color: white; }

        .shop-layout { display: grid; grid-template-columns: 1fr 380px; gap: 40px; max-width: 1300px; margin: 0 auto; padding: 120px 2rem; }
        .category-title { font-size: 1.8rem; font-weight: 800; margin: 40px 0 20px; border-left: 4px solid var(--accent); padding-left: 15px; grid-column: 1 / -1; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .product-card { 
            background: var(--card); border: 1px solid var(--border) !important; border-radius: 24px; padding: 30px 20px;
            display: flex; flex-direction: column; align-items: center; text-align: center; transition: 0.3s;
        }

        .qty-selector { display: flex; align-items: center; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 15px; padding: 5px; }
        .qty-btn { width: 30px; height: 30px; background: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .qty-val { width: 35px; text-align: center; font-weight: 800; color: var(--primary); }

        .btn-action { 
            background: #fff; color: #000; padding: 12px 25px; border-radius: 12px; 
            font-weight: 800; cursor: pointer; transition: 0.3s; width: 100%;
        }
        .btn-action:hover { background: var(--primary); color: white; }

        .page { display: none; }
        .page.active { display: block; }

        .log-box { background: #070b14; border: 1px solid var(--primary); border-radius: 15px; padding: 20px; font-family: monospace; min-height: 400px; }
        input, textarea { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; color: white; border: 1px solid var(--border); margin-bottom: 15px; font-family: inherit; }

        @media (max-width: 1000px) { .shop-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="glow"></div>

<nav>
    <a href="#" style="color:white; text-decoration:none; font-weight:800;">EDF<span>.</span></a>
    <div class="nav-links">
        <button onclick="showPage('accueil')" id="btn-accueil" class="active">Vision</button>
        <button onclick="showPage('boutique')" id="btn-boutique">Boutique</button>
        <button onclick="showPage('avis')" id="btn-avis">Avis</button>
        <button onclick="showPage('staff-login')" id="btn-staff">Portal</button>
    </div>
</nav>

<div id="accueil" class="page active">
    <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20px;">
        <h1 style="font-size: 3.5rem; font-weight: 800; line-height: 1;">L'Innovation<br><span style="color:var(--primary);">Électrique</span>.</h1>
        <p style="color:var(--text-dim); margin-top: 20px; max-width: 600px;">Pourquoi choisir EDF ? Des équipements certifiés, une expertise unique et des solutions durables.</p>
        <button onclick="showPage('boutique')" class="btn-action" style="width: auto; margin-top: 30px; padding: 15px 40px; border-radius: 100px;">Accéder au Catalogue</button>
    </div>
</div>

<div id="boutique" class="page">
    <div class="shop-layout">
        <div id="product-list">
            </div>
        
        <div style="background: rgba(15,23,42,0.9); padding:30px; border-radius:30px; height:fit-content; border:1px solid var(--primary); position: sticky; top: 110px;">
            <h3 style="margin-bottom:20px; font-weight: 800;">🛒 Votre Panier</h3>
            <input type="text" id="client-name" placeholder="Nom du Client RP">
            <div id="cart-items" style="margin-bottom:20px; max-height: 250px; overflow-y: auto;"></div>
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.6rem; border-top: 1px solid var(--border); padding-top: 15px;">
                <span style="font-size: 0.9rem; color: var(--text-dim);">TOTAL</span>
                <span id="total-price" style="color:var(--accent);">0 €</span>
            </div>
            <button class="btn-action" style="margin-top:25px; background:var(--accent); color:white;" onclick="processOrder()">VALIDER LA VENTE</button>
        </div>
    </div>
</div>

<div id="avis" class="page">
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="background:var(--card); padding:40px; border-radius:30px; border:1px solid var(--border); width:100%; max-width:500px;">
            <h2 style="margin-bottom:20px;">Laissez un avis</h2>
            <textarea id="review-text" rows="5" placeholder="Votre expérience avec nos services..."></textarea>
            <button class="btn-action" onclick="alert('Merci pour votre retour !'); document.getElementById('review-text').value=''">Envoyer l'avis</button>
        </div>
    </div>
</div>

<div id="staff-login" class="page">
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="background:var(--card); padding:40px; border-radius:30px; border:1px solid var(--border); width:350px; text-align: center;">
            <h2 style="margin-bottom:20px;">Staff Portal</h2>
            <input type="password" id="staff-code" placeholder="Code (1981 / 2009)" style="text-align:center;">
            <button class="btn-action" onclick="verifyCode()">S'identifier</button>
        </div>
    </div>
</div>

<div id="staff-dashboard" class="page">
    <div style="max-width:800px; margin:140px auto; padding:0 20px;">
        <h2 style="margin-bottom:30px;">Historique des Ventes</h2>
        <div id="orders-list"></div>
    </div>
</div>

<div id="staff-logs" class="page">
    <div style="max-width:900px; margin:140px auto; padding:0 20px;">
        <h2 style="margin-bottom:20px; color: var(--primary);">Journal de Sécurité [Logs 2009]</h2>
        <div class="log-box" id="logs-container"></div>
    </div>
</div>

<script>
    const categories = [
        {
            title: "Sécurité & Infrastructure",
            items: [
                { id: 1, name: "Armoire Électrique Blindée", price: 1699 },
                { id: 2, name: "Caméra Dôme 360° AI", price: 799 },
                { id: 3, name: "Tableau Divisionnaire Pro", price: 549 }
            ]
        },
        {
            title: "Luminaires Premium",
            items: [
                { id: 4, name: "Lustre Royal Crystal", price: 26000 },
                { id: 5, name: "Lustre Minimaliste", price: 9000 },
                { id: 6, name: "Néon Design Bleu", price: 359 },
                { id: 7, name: "Lampadaire Urbain", price: 699 }
            ]
        },
        {
            title: "Énergie Solaire",
            items: [
                { id: 8, name: "Panneau Solaire 500W", price: 1200 },
                { id: 9, name: "Kit Solaire Plat", price: 1000 },
                { id: 10, name: "Borne Solaire Autonome", price: 700 }
            ]
        }
    ];

    let cart = [];

    function init() {
        const list = document.getElementById('product-list');
        list.innerHTML = categories.map(cat => `
            <h2 class="category-title">${cat.title}</h2>
            <div class="products-grid">
                ${cat.items.map(p => `
                    <div class="product-card">
                        <h4 style="height:45px;">${p.name}</h4>
                        <p style="color:var(--accent); font-size:1.6rem; font-weight:800; margin:15px 0;">${p.price.toLocaleString()}€</p>
                        <div class="qty-selector">
                            <button class="qty-btn" onclick="changeQty(${p.id}, -1)">-</button>
                            <span class="qty-val" id="qty-${p.id}">1</span>
                            <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
                        </div>
                        <button class="btn-action" onclick="addToCart(${p.id})">Ajouter</button>
                    </div>
                `).join('')}
            </div>
        `).join('');
    }

    function changeQty(id, delta) {
        const el = document.getElementById(`qty-${id}`);
        let val = parseInt(el.innerText) + delta;
        if (val >= 1) el.innerText = val;
    }

    function addToCart(id) {
        let product;
        categories.forEach(c => { const found = c.items.find(i => i.id === id); if(found) product = found; });
        const qty = parseInt(document.getElementById(`qty-${id}`).innerText);
        const existing = cart.find(c => c.id === id);
        if (existing) existing.qty += qty; else cart.push({ ...product, qty: qty });
        document.getElementById(`qty-${id}`).innerText = "1";
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cart-items');
        let total = 0;
        if (cart.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:20px;">Vide.</p>';
        } else {
            container.innerHTML = cart.map(c => {
                total += (c.price * c.qty);
                return `<div style="display:flex; justify-content:space-between; margin-bottom:10px; background:rgba(255,255,255,0.03); padding:10px; border-radius:10px;">
                    <span><b style="color:var(--primary)">x${c.qty}</b> ${c.name}</span>
                    <b>${(c.price * c.qty).toLocaleString()}€</b>
                </div>`;
            }).join('');
        }
        document.getElementById('total-price').innerText = total.toLocaleString() + " €";
    }

    function processOrder() {
        const name = document.getElementById('client-name').value;
        if (!name || cart.length === 0) return alert("Champs vides !");
        const total = cart.reduce((s, c) => s + (c.price * c.qty), 0);
        const order = { name, total, summary: cart.map(c => `${c.qty}x ${c.name}`).join(', '), date: new Date().toLocaleString() };
        let db = JSON.parse(localStorage.getItem('edf_orders_final')) || [];
        db.push(order);
        localStorage.setItem('edf_orders_final', JSON.stringify(db));
        alert("Succès !"); cart = []; document.getElementById('client-name').value = ""; renderCart();
    }

    function verifyCode() {
        const val = document.getElementById('staff-code').value;
        if (val === "1981") { showPage('staff-dashboard'); renderStaff(); }
        else if (val === "2009") { showPage('staff-logs'); renderLogs(); }
        else alert("Code erroné.");
        document.getElementById('staff-code').value = "";
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn-' + id.split('-')[0]);
        if(btn) btn.classList.add('active');
    }

    function renderStaff() {
        const db = JSON.parse(localStorage.getItem('edf_orders_final')) || [];
        document.getElementById('orders-list').innerHTML = db.reverse().map(o => `
            <div style="background:var(--card); padding:20px; border-radius:20px; margin-bottom:15px; border:1px solid var(--border);">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><b>${o.name}</b><small>${o.date}</small></div>
                <p style="color:var(--text-dim);">${o.summary}</p>
                <div style="margin-top:10px; color:var(--primary); font-weight:800;">${o.total.toLocaleString()} €</div>
            </div>
        `).join('') || "Aucune donnée.";
    }

    function renderLogs() {
        const db = JSON.parse(localStorage.getItem('edf_orders_final')) || [];
        document.getElementById('logs-container').innerHTML = db.map(o => `
            <div style="font-size:0.8rem; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.05);">
                [${o.date}] [SALE] Client: ${o.name} | Items: ${o.summary} | Total: ${o.total}€
            </div>
        `).join('') || ">_ Waiting for transactions...";
    }

    window.onload = init;
</script>
</body>
</html>
