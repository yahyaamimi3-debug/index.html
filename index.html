<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDF – Énergie & Innovation</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://unpkg.com/scrollreveal"></script>
    
    <style>
        :root {
            --edf-blue: #005BBB;
            --edf-orange: #FF7900;
            --edf-dark: #0a192f;
            --light: #f8fafc;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { margin:0; padding:0; box-sizing:border-box; scroll-behavior: smooth; }
        body { font-family: 'Open Sans', sans-serif; background: var(--light); color: var(--edf-dark); overflow-x: hidden; }

        /* NAVIGATION */
        nav { 
            background: var(--glass); 
            backdrop-filter: blur(15px);
            height: 85px; 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.03); 
            position: sticky; top: 0; z-index: 1000; 
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .nav-inner { max-width: 1400px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; }
        .logo { font-family: 'Montserrat'; font-weight: 900; font-size: 2.4rem; color: var(--edf-blue); text-decoration: none; }
        .logo span { color: var(--edf-orange); }
        .nav-links { display: flex; gap: 0.8rem; }
        .nav-links button { 
            background: none; border: none; font-family: 'Montserrat'; font-weight: 700; font-size: 0.85rem; 
            cursor: pointer; color: var(--edf-dark); transition: 0.3s; padding: 0.8rem 1.4rem; border-radius: 50px; 
        }
        .nav-links button.active { background: var(--edf-blue); color: white; }
        .btn-staff { border: 2px solid var(--edf-orange) !important; color: var(--edf-orange) !important; }

        /* HERO */
        .hero { 
            background: linear-gradient(135deg, var(--edf-blue) 0%, var(--edf-dark) 100%);
            color: white; border-radius: 0 0 60px 60px; padding: 8rem 2rem; text-align: center; margin-bottom: 4rem;
        }
        .hero h1 { font-family: 'Montserrat'; font-size: 4rem; font-weight: 900; margin-bottom: 1rem; }

        /* BOUTIQUE */
        .shop-container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .shop-layout { display: grid; grid-template-columns: 1fr 380px; gap: 3rem; }
        .category-title { font-family: 'Montserrat'; font-size: 1.8rem; font-weight: 900; color: var(--edf-blue); margin: 3rem 0 1.5rem; border-bottom: 3px solid var(--edf-orange); display: inline-block; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .product-card { 
            background: white; border-radius: 20px; padding: 2rem; box-shadow: 0 5px 15px rgba(0,0,0,0.03); 
            transition: 0.3s; text-align: center; border: 1px solid #eee; display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .price-tag { color: var(--edf-orange); font-weight: 900; font-size: 1.5rem; margin: 1rem 0; }

        /* PANIER */
        .cart-panel { background: var(--white); padding: 2rem; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); border: 2px solid var(--edf-blue); position: sticky; top: 120px; height: fit-content; }
        .btn-main { background: var(--edf-blue); color: white; border: none; padding: 1rem; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; transition: 0.3s; }
        .btn-main:hover { background: var(--edf-orange); }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 1000px) { .shop-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<nav>
    <div class="nav-inner">
        <a href="#" class="logo" onclick="showPage('accueil')">EDF<span>.</span></a>
        <div class="nav-links">
            <button onclick="showPage('accueil')" id="btn-accueil" class="active">ACCUEIL</button>
            <button onclick="showPage('boutique')" id="btn-boutique">BOUTIQUE</button>
            <button onclick="showPage('avis')" id="btn-avis">AVIS</button>
            <button onclick="checkStaffAccess()" id="btn-staff" class="btn-staff">STAFF</button>
        </div>
    </div>
</nav>

<div id="accueil" class="page active">
    <div class="hero">
        <h1>Énergie & Innovation</h1>
        <p>Le partenaire officiel de vos projets électriques.</p>
    </div>
    <div class="shop-container" style="text-align: center;">
        <h2 class="category-title">Expertise Garantie</h2>
        <p>Fiabilité, Sécurité et Durabilité pour toutes vos installations.</p>
    </div>
</div>

<div id="boutique" class="page">
    <div class="shop-container">
        <div class="shop-layout">
            <div id="product-list"></div>
            <div class="cart-panel">
                <h3 style="margin-bottom: 1rem;">🛒 Votre Panier</h3>
                <input type="text" id="client-name" placeholder="Nom Prénom RP" style="width: 100%; padding: 12px; margin-bottom: 1rem; border-radius: 10px; border: 1px solid #ddd;">
                <div id="cart-items" style="margin-bottom: 1.5rem;"></div>
                <div style="display: flex; justify-content: space-between; font-weight: 900; font-size: 1.5rem; color: var(--edf-blue);">
                    <span>TOTAL</span><span id="total-price">0 €</span>
                </div>
                <button class="btn-main" style="margin-top: 1.5rem; background: var(--edf-orange);" onclick="processOrder()">VALIDER</button>
            </div>
        </div>
    </div>
</div>

<div id="staff-login" class="page">
    <div style="max-width: 400px; margin: 100px auto; background: white; padding: 3rem; border-radius: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        <h2>Accès Staff</h2>
        <input type="password" id="staff-code" placeholder="Code secret" style="width: 100%; padding: 10px; margin: 1rem 0; text-align: center;">
        <button class="btn-main" onclick="verifyCode()">Entrer</button>
    </div>
</div>

<div id="staff-dashboard" class="page">
    <div class="shop-container">
        <h2>Commandes à traiter</h2>
        <div id="orders-list" style="margin-top: 2rem;"></div>
    </div>
</div>

<script>
    const products = [
        { cat: "Sécurité & Technique", items: [
            { name: "Armoire électrique TGBT", price: 1699 },
            { name: "Caméra de sécurité dôme", price: 799 },
            { name: "Tableau Électrique Schneider", price: 549 }
        ]},
        { cat: "Luminaires", items: [
            { name: "Lustre Cristal Royal", price: 26000 },
            { name: "Lustre Contemporain", price: 9000 },
            { name: "Lampadaire de Rue LED", price: 699 }
        ]},
        { cat: "Solaire", items: [
            { name: "Panneau Solaire (Incliné)", price: 1200 },
            { name: "Panneau Solaire (Plat)", price: 1000 }
        ]}
    ];

    function initShop() {
        const container = document.getElementById('product-list');
        container.innerHTML = products.map(category => `
            <h2 class="category-title">${category.cat}</h2>
            <div class="products-grid">
                ${category.items.map(p => `
                    <div class="product-card">
                        <h4 style="font-family:'Montserrat';">${p.name}</h4>
                        <div class="price-tag">${p.price.toLocaleString()} €</div>
                        <button class="btn-main" onclick="addToCart('${p.name.replace(/'/g, "\\'")}', ${p.price})">Ajouter</button>
                    </div>
                `).join('')}
            </div>
        `).join('');
    }

    let cart = []; let total = 0;
    function addToCart(name, price) {
        cart.push({name, price}); total += price; updateCart();
    }

    function updateCart() {
        const list = document.getElementById('cart-items');
        list.innerHTML = cart.map(item => `<div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:5px;"><span>${item.name}</span><b>${item.price} €</b></div>`).join('');
        document.getElementById('total-price').innerText = total.toLocaleString() + " €";
    }

    function processOrder() {
        const name = document.getElementById('client-name').value;
        if(!name || cart.length === 0) return alert("Nom ou panier vide !");
        let orders = JSON.parse(localStorage.getItem('edf_orders')) || [];
        orders.push({ client: name, items: cart, total: total, date: new Date().toLocaleString() });
        localStorage.setItem('edf_orders', JSON.stringify(orders));
        alert("Commande transmise !"); cart = []; total = 0; updateCart();
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function checkStaffAccess() { showPage('staff-login'); }
    function verifyCode() {
        if(document.getElementById('staff-code').value === "1981") { showPage('staff-dashboard'); loadOrders(); }
        else alert("Code erroné.");
    }

    function loadOrders() {
        const div = document.getElementById('orders-list');
        const orders = JSON.parse(localStorage.getItem('edf_orders')) || [];
        div.innerHTML = orders.reverse().map(o => `
            <div style="background:white; padding:1.5rem; border-radius:15px; margin-bottom:1rem; border-left:5px solid var(--edf-blue);">
                <strong>${o.client}</strong> - ${o.date}<br>
                <small>${o.items.map(i => i.name).join(', ')}</small><br>
                <b style="color:var(--edf-orange)">Total : ${o.total} €</b>
            </div>
        `).join('');
    }

    window.onload = initShop;
</script>
</body>
</html>
