<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROSSISTE . PRO</title>
    <style>
        /* --- DESIGN LUXE MINIMALISTE INTERACTIF --- */
        :root {
            --bg-main: #0b0f19;
            --bg-surface: rgba(22, 28, 45, 0.6);
            --bg-surface-solid: #161c2d;
            --bg-input: #121824;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(56, 189, 248, 0.4);
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            padding-bottom: 100px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- LOGO & NAV PREMIUM --- */
        nav { 
            background: rgba(11, 15, 25, 0.8); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.1em; font-weight: 800; letter-spacing: 2px; color: #fff; }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 8px; }
        nav button { 
            background: transparent; border: none; color: var(--text-muted); 
            padding: 8px 16px; font-size: 0.85em; font-weight: 600; cursor: pointer; border-radius: var(--radius-md);
            transition: all 0.3s ease;
        }
        nav button:hover { color: #fff; background: rgba(255,255,255,0.03); }
        nav button.active { color: #fff; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); }

        /* --- HEADER ÉPURÉ --- */
        header { padding: 60px 20px 40px; text-align: center; }
        header h1 { font-size: 2.2em; font-weight: 300; letter-spacing: -0.5px; margin-bottom: 8px; }
        header h1 b { font-weight: 800; color: #fff; }
        header p { font-size: 0.85em; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .page { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; }
        .page.active-page { display: block; opacity: 1; transform: translateY(0); }

        /* --- ZONE CONFIGURATION NOM RP --- */
        .rp-section {
            background: var(--bg-surface); border: 1px solid var(--border); backdrop-filter: blur(10px);
            padding: 30px; border-radius: var(--radius-lg); margin-bottom: 40px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .rp-section label { font-size: 0.8em; font-weight: 700; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; }
        .rp-section input {
            background: var(--bg-input); border: 1px solid var(--border); color: #fff;
            padding: 16px; font-size: 1em; border-radius: var(--radius-md); outline: none;
            transition: all 0.3s ease;
        }
        .rp-section input:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }

        /* --- GRILLE DU CATALOGUE --- */
        h2 { font-size: 1.3em; font-weight: 700; margin-bottom: 25px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
        h2 span { font-size: 0.65em; background: rgba(255,255,255,0.05); color: var(--text-muted); padding: 4px 10px; border-radius: 20px; font-weight: 500; }
        
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
        .product-card {
            background: var(--bg-surface); border: 1px solid var(--border); backdrop-filter: blur(10px);
            border-radius: var(--radius-lg); padding: 24px; display: flex; flex-direction: column; justify-content: space-between;
            height: 180px; position: relative; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-4px); border-color: var(--border-hover); box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }
        .product-meta h3 { font-size: 1.1em; font-weight: 600; color: #fff; margin-bottom: 6px; }
        .product-meta .price { font-size: 1.2em; font-weight: 700; color: var(--accent); }
        
        /* --- ACTION BUTTONS LUXE --- */
        .btn {
            background: var(--bg-input); color: #fff; border: 1px solid var(--border);
            padding: 12px 20px; border-radius: var(--radius-md); font-weight: 600; font-size: 0.85em;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.3s ease; width: 100%;
        }
        .btn:hover { background: #fff; color: var(--bg-main); border-color: #fff; }
        
        /* --- CONFIGURATEUR FLOTTANT PANIER --- */
        .cart-toggle {
            position: fixed; bottom: 30px; right: 30px; background: #fff; color: var(--bg-main);
            border: none; padding: 16px 28px; font-weight: 700; font-size: 0.9em; border-radius: 40px;
            cursor: pointer; box-shadow: 0 10px 30px rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; z-index: 99;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cart-toggle:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(255,255,255,0.15); }
        .cart-badge { background: var(--bg-main); color: #fff; font-size: 0.75em; padding: 3px 9px; border-radius: 20px; }

        /* --- PANIER SLIDEOUT (POPUP) --- */
        .cart-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px); z-index: 999; display: none; opacity: 0; transition: opacity 0.3s ease;
        }
        .cart-overlay.open { display: block; opacity: 1; }
        
        .cart-modal {
            position: fixed; top: 0; right: -460px; width: 460px; height: 100%;
            background: var(--bg-surface-solid); border-left: 1px solid var(--border);
            z-index: 1000; padding: 40px; display: flex; flex-direction: column;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cart-modal.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .cart-header h3 { font-size: 1.4em; font-weight: 700; }
        .cart-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.8em; cursor: pointer; transition: color 0.2s; }
        .cart-close:hover { color: #fff; }
        
        .cart-items-feed { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; margin-right: -10px; padding-right: 10px; }
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            padding: 16px; border-radius: var(--radius-md);
        }
        .item-info h4 { font-size: 0.95em; font-weight: 600; margin-bottom: 4px; }
        .item-info p { font-size: 0.9em; color: var(--accent); font-weight: 700; }
        .item-actions { display: flex; align-items: center; gap: 12px; }
        .item-actions input {
            background: var(--bg-input); border: 1px solid var(--border); color: #fff;
            width: 50px; text-align: center; padding: 6px; border-radius: 6px; outline: none;
        }
        .btn-remove { background: transparent; border: none; color: var(--text-muted); font-size: 1.1em; cursor: pointer; }
        .btn-remove:hover { color: #f87171; }

        .cart-footer { margin-top: auto; padding-top: 30px; border-top: 1px solid var(--border); }
        .cart-total-row { display: flex; justify-content: space-between; font-size: 1.3em; font-weight: 700; margin-bottom: 20px; }
        .cart-total-row span:last-child { color: var(--accent); }
        .btn-checkout { background: var(--accent); color: var(--bg-main); font-size: 0.95em; font-weight: 700; padding: 16px; }
        .btn-checkout:hover { background: #7dd3fc; border-color: #7dd3fc; transform: none; box-shadow: 0 0 25px var(--accent-glow); }

        /* --- ENTREPOT LOGS --- */
        #lock-screen { text-align: center; padding: 40px; max-width: 400px; margin: 60px auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-surface); }
        #lock-screen input { background: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 14px; width: 100%; margin-bottom: 20px; text-align: center; border-radius: var(--radius-md); outline: none; font-size: 1.1em; letter-spacing: 2px; }
        #employee-dashboard { display: none; }
        .orders-grid { display: flex; flex-direction: column; gap: 16px; }
        .order-card { background: var(--bg-surface); border: 1px solid var(--border); padding: 24px; border-radius: var(--radius-lg); }
        .order-head { display: flex; justify-content: space-between; font-size: 0.85em; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
        .order-head b { color: #fff; }

        @media (max-width: 500px) { .cart-modal { width: 100%; right: -100%; padding: 24px; } }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <div class="logo">GROSSISTE<span>.PRO</span></div>
            <div class="nav-links">
                <button id="nav-catalogue" class="active" onclick="changerPage('catalogue')">CENTRAL CATALOGUE</button>
                <button id="nav-employe" onclick="changerPage('employe')">LOGISTIQUE ENTREPÔT</button>
            </div>
        </div>
    </nav>

    <!-- Header Épuré -->
    <header>
        <h1>ACCÈS <b>PLATEFORME</b></h1>
        <p>Ajustement direct de stock & commandes</p>
    </header>

    <div class="container">

        <!-- CONFIGURATION & CATALOGUE -->
        <div id="page-catalogue" class="page active-page">
            <div class="rp-section">
                <label for="player-name-rp">Identité en ville (Nom RP)</label>
                <input type="text" id="player-name-rp" placeholder="Entrez votre Prénom et Nom...">
            </div>

            <h2>LIVRET DES STOCKS <span>28 CATEGORIES</span></h2>
            <div class="catalog-grid" id="catalog-container">
                <!-- Injection JS -->
            </div>
        </div>

        <!-- ACCÈS ENTREPÔT -->
        <div id="page-employe" class="page">
            <div id="lock-screen">
                <h2 style="justify-content: center; margin-bottom: 10px;">ACCÈS SÉCURISÉ</h2>
                <input type="password" id="code-secu" placeholder="••••">
                <button class="btn" onclick="authentifierEmploye()">S'AUTHENTIFIER</button>
            </div>

            <div id="employee-dashboard">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                    <h2>BONS DE PICKING EN ATTENTE</h2>
                    <button class="btn" style="width:auto; padding:10px 20px; background:rgba(248,113,113,0.05); color:#f87171; border-color:rgba(248,113,113,0.1);" onclick="viderToutesLesCommandes()">PURGER LA BASE</button>
                </div>
                <div id="orders-feed" class="orders-grid"></div>
            </div>
        </div>

    </div>

    <!-- PANIER FLOTTANT -->
    <button class="cart-toggle" onclick="togglePanier(true)">
        PANIER <span class="cart-badge" id="global-cart-count">0</span>
    </button>

    <!-- MODAL PANIER BACKDROP -->
    <div class="cart-overlay" id="cart-overlay-bg" onclick="togglePanier(false)"></div>
    <div class="cart-modal" id="cart-popup">
        <div class="cart-header">
            <h3>VOTRE DEMANDE</h3>
            <button class="cart-close" onclick="togglePanier(false)">×</button>
        </div>
        <div class="cart-items-feed" id="cart-items-container">
            <!-- Items JS -->
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Estimation totale :</span>
                <span id="cart-total-price">0.00 €</span>
            </div>
            <button class="btn btn-checkout" onclick="transmettreCommande()">TRANSMETTRE LE BON</button>
        </div>
    </div>

<script>
const DISCORD_WEBHOOK_URL = "https://discordapp.com/api/webhooks/1519738501413736578/1YO6Mqm6FKQl66e0CaZoVRwi7E2OBs5gfILGYU6zlnD30dMVZDBVyY-OdQMcAvSU_vKT";

const catalogueProduits = [
    { id: 1, nom: "Chocolat", prix: 2.00 }, { id: 2, nom: "Farine", prix: 5.00 },
    { id: 3, nom: "Levure", prix: 4.00 }, { id: 4, nom: "Lait", prix: 4.00 },
    { id: 5, nom: "Sucre", prix: 7.50 }, { id: 6, nom: "Sel", prix: 7.50 },
    { id: 7, nom: "Oeuf", prix: 2.00 }, { id: 8, nom: "Tomate", prix: 3.00 },
    { id: 9, nom: "Salade", prix: 3.00 }, { id: 10, nom: "Pain Burger", prix: 4.00 },
    { id: 11, nom: "Moutarde", prix: 5.00 }, { id: 12, nom: "Cornichon", prix: 5.00 },
    { id: 13, nom: "Beurre", prix: 4.00 }, { id: 14, nom: "Pomme de terre (25kg)", prix: 20.00 },
    { id: 15, nom: "Huile de friture", prix: 5.00 }, { id: 16, nom: "Chocolat en poudre", prix: 15.00 },
    { id: 17, nom: "Café", prix: 25.00 }, { id: 18, nom: "Lait en poudre", prix: 5.00 },
    { id: 19, nom: "Soda", prix: 6.00 }, { id: 20, nom: "Steak", prix: 7.50 },
    { id: 21, nom: "Poire", prix: 5.00 }, { id: 22, nom: "Pomme", prix: 5.00 },
    { id: 23, nom: "Fromage", prix: 6.00 }, { id: 24, nom: "Eau", prix: 3.00 },
    { id: 25, nom: "Chips", prix: 7.50 }, { id: 26, nom: "COUROIE", prix: 150.00 },
    { id: 27, nom: "BATTERIE", prix: 250.00 }, { id: 28, nom: "BOUGGIE", prix: 200.00 }
];

let panier = {};
let baseCommandes = JSON.parse(localStorage.getItem('grossiste_commandes')) || [];

function changerPage(nomPage) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    
    const target = document.getElementById(`page-${nomPage}`);
    target.classList.add('active-page');
    document.getElementById(`nav-${nomPage}`).classList.add('active');
    
    if(nomPage === 'employe' && document.getElementById('employee-dashboard').style.display === 'block') {
        afficherFluxCommandes();
    }
}

// Initialisation de la grille
const grid = document.getElementById('catalog-container');
catalogueProduits.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
        <div class="product-meta">
            <h3>${p.nom}</h3>
            <div class="price">${p.prix.toFixed(2)} €</div>
        </div>
        <button class="btn" onclick="ajouterAuPanier(${p.id})">Ajouter au panier</button>
    `;
    grid.appendChild(card);
});

function togglePanier(ouvrir) {
    document.getElementById('cart-popup').classList.toggle('open', ouvrir);
    document.getElementById('cart-overlay-bg').classList.toggle('open', ouvrir);
}

function ajouterAuPanier(id) {
    panier[id] = (panier[id] || 0) + 1;
    majAffichagePanier();
}

function changerQuantite(id, qte) {
    if (qte <= 0) delete panier[id];
    else panier[id] = qte;
    majAffichagePanier();
}

function supprimerDuPanier(id) {
    delete panier[id];
    majAffichagePanier();
}

function majAffichagePanier() {
    const container = document.getElementById('cart-items-container');
    container.innerHTML = "";
    let total = 0;
    let nbArticles = 0;

    Object.keys(panier).forEach(id => {
        const prod = catalogueProduits.find(p => p.id == id);
        const qte = panier[id];
        const sub = prod.prix * qte;
        total += sub;
        nbArticles += qte;

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
            <div class="item-info">
                <h4>${prod.nom}</h4>
                <p>${sub.toFixed(2)} €</p>
            </div>
            <div class="item-actions">
                <input type="number" min="1" value="${qte}" onchange="changerQuantite(${id}, parseInt(this.value)||1)">
                <button class="btn-remove" onclick="supprimerDuPanier(${id})">✕</button>
            </div>
        `;
        container.appendChild(div);
    });

    document.getElementById('global-cart-count').innerText = nbArticles;
    document.getElementById('cart-total-price').innerText = total.toFixed(2) + " €";
}

function transmettreCommande() {
    const nomRP = document.getElementById('player-name-rp').value.trim();
    if(!nomRP) {
        alert("🔒 REQUIS : Veuillez indiquer votre NOM RP avant d'envoyer le bon.");
        return;
    }

    const keys = Object.keys(panier);
    if(keys.length === 0) {
        alert("Le panier ne contient aucune marchandise.");
        return;
    }

    let prixTotal = document.getElementById('cart-total-price').innerText;
    let texteDiscord = "";
    let listeLog = [];

    keys.forEach(id => {
        const prod = catalogueProduits.find(p => p.id == id);
        const qte = panier[id];
        texteDiscord += `📦 **${prod.nom}** × ${qte}  *( ${(prod.prix * qte).toFixed(2)} € )*\n`;
        listeLog.push({ nom: prod.nom, quantite: qte, prixLigne: (prod.prix * qte).toFixed(2) });
    });

    const ticketID = 'CMD-' + Math.floor(1000 + Math.random() * 9000);
    const heure = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});

    baseCommandes.push({ idTicket: ticketID, heure: heure, nomRP: nomRP, marchandises: listeLog, totalFacture: prixTotal });
    localStorage.setItem('grossiste_commandes', JSON.stringify(baseCommandes));

    const payload = {
        username: "Centrale Logistique",
        embeds: [{
            title: `📥 Demande d'approvisionnement — ${ticketID}`,
            color: 3716344,
            fields: [
                { name: "👤 Opérateur (Nom RP)", value: `\`${nomRP}\``, inline: true },
                { name: "🕒 Réception", value: heure, inline: true },
                { name: "🛒 Manifeste de chargement", value: texteDiscord, inline: false },
                { name: "💰 Valeur Marchande", value: `**${prixTotal}**`, inline: false }
            ],
            footer: { text: "Système automatisé logistique Grossiste.Pro" },
            timestamp: new Date().toISOString()
        }]
    };

    fetch(DISCORD_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    alert(`✅ Manifeste transmis avec succès dans votre salon Discord.`);
    panier = {};
    majAffichagePanier();
    togglePanier(false);
}

function authentifierEmploye() {
    if (document.getElementById('code-secu').value === "2009") {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('employee-dashboard').style.display = 'block';
        afficherFluxCommandes();
    } else {
        alert("ACCÈS RÉSERVÉ.");
    }
}

function afficherFluxCommandes() {
    const feed = document.getElementById('orders-feed');
    feed.innerHTML = baseCommandes.length === 0 ? "<p style='text-align:center; font-style:italic; color:var(--text-muted); padding:40px 0;'>Aucun traitement en cours.</p>" : "";

    [...baseCommandes].reverse().forEach(cmd => {
        const div = document.createElement('div');
        div.className = 'order-card';
        let items = cmd.marchandises.map(m => `<li><b>${m.nom}</b> × ${m.quantite} <span style="color:var(--text-muted)">(${m.prixLigne} €)</span></li>`).join('');
        div.innerHTML = `
            <div class="order-head"><span>ID: <b>${cmd.idTicket}</b> | OPÉRATEUR: <b>${cmd.nomRP}</b></span><span>${cmd.heure}</span></div>
            <ul style="padding-left:18px; margin:0; font-size:0.9em; display:flex; flex-direction:column; gap:4px;">${items}</ul>
            <div style="text-align:right; font-weight:700; margin-top:14px; font-size:1.05em; color:var(--accent)">Total : ${cmd.totalFacture}</div>
        `;
        feed.appendChild(div);
    });
}

function viderToutesLesCommandes() {
    if(confirm("Purger définitivement tous les bons logistiques locaux ?")) { 
        baseCommandes = []; 
        localStorage.removeItem('grossiste_commandes'); 
        afficherFluxCommandes(); 
    }
}
</script>
</body>
</html>
